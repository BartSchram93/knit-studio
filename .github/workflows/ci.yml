name: CI

# Every push and pull request: tests plus both apps. Pushes to main also refresh the
# "latest" pre-release, whose download links never change:
#   https://github.com/<owner>/knit-studio/releases/download/latest/KnitStudio.ipa
#   https://github.com/<owner>/knit-studio/releases/download/latest/KnitStudio.apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled to save macOS minutes; main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  latest:
    name: Publish "latest" pre-release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: KnitStudio-*
          merge-multiple: true
      - name: Replace the "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -la dist
          NOTES="Automatic build of \`main\` — version $VERSION, build ${{ github.run_number }}, commit ${GITHUB_SHA::7}, $(date -u +'%Y-%m-%d %H:%M UTC').

          - **iPhone:** \`KnitStudio.ipa\` (unsigned) — install or update it with AltStore, see IOS_ALTSTORE_SETUP.md.
          - **Android:** \`KnitStudio.apk\` — see docs/INSTALL_ANDROID.md.

          The versioned files are the same builds under their full names. This pre-release is replaced on every push to main; tagged releases (v*) stay."
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest dist/*.ipa dist/*.apk dist/ipa-info.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Latest build — $VERSION (build ${{ github.run_number }})" --notes "$NOTES"
