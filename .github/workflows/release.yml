name: Release

# Run manually from the Actions tab: builds the APKs, creates the tag and a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match versionName, e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew :shared:jvmTest :composeApp:jvmTest :androidApp:testDebugUnitTest
      - name: Build APKs
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/KnitStudio-${{ inputs.version }}-release.apk"
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "dist/KnitStudio-${{ inputs.version }}-debug.apk"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "Knit Studio ${{ inputs.version }}" \
            --notes "See CHANGELOG.md and docs/PROJECT.md. Android: docs/INSTALL_ANDROID.md. iOS: docs/INSTALL_IOS.md."
