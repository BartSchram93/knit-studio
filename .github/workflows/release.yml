name: Release

# Run from the Actions tab to publish a numbered release (tag vX.Y.Z) with the Android APKs and
# the unsigned iOS IPA. Bump versionName in androidApp/build.gradle.kts first; the iOS app uses
# the same version.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: KnitStudio-*
          merge-multiple: true
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Increase versionName in androidApp/build.gradle.kts and run again."
            exit 1
          fi
          gh release create "v$VERSION" dist/*.ipa dist/*.apk dist/ipa-info.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Knit Studio $VERSION" \
            --notes "Knit Studio $VERSION (build ${{ github.run_number }}). See CHANGELOG.md.

          - **iPhone:** \`KnitStudio.ipa\` (unsigned) — install or update with AltStore, see IOS_ALTSTORE_SETUP.md.
          - **Android:** \`KnitStudio.apk\` — see docs/INSTALL_ANDROID.md."
